<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butiksskærm</title>
<link rel="stylesheet" href="/admin/faelles.css">
<link rel="stylesheet" href="/butik/butik.css">
</head>
<body>
<div id="blink" class="blink" aria-hidden="true"></div>

<header class="top">
  <div class="top-titel">
    <h1><span class="neon-titel" id="traef-navn">Butiksskærm</span></h1>
    <span class="forbindelse" id="forbindelse" title="Live-forbindelse"><span class="prik"></span><span class="tekst">Forbinder…</span></span>
    <div class="bruger" id="bruger"></div>
  </div>
  <div class="top-vaerktoej">
    <label class="soeg"><span class="skjult-visuelt">Søg på PC-nr eller ordrenr</span>
      <input type="search" id="soeg" placeholder="Søg PC / #ordre" inputmode="numeric" autocomplete="off"></label>
    <div class="segment" role="group" aria-label="Filter">
      <button class="knap lille aktiv" data-filter="alle" aria-pressed="true">Alle</button>
      <button class="knap lille" data-filter="bord" aria-pressed="false"><span class="lang">Kun </span>levering</button>
      <button class="knap lille" data-filter="hent" aria-pressed="false"><span class="lang">Kun </span>afhentning</button>
    </div>
    <button class="knap lille" id="indbetalinger-knap" aria-expanded="false" aria-controls="indbetalinger-panel">
      Indbetalinger <span class="badge" id="indbetalinger-antal" hidden>0</span></button>
    <button class="knap lille" id="udsolgt-knap" aria-expanded="false" aria-controls="udsolgt-panel">Udsolgt</button>
    <button class="knap lille ikon-knap" id="visning-knap" aria-pressed="false"><span class="ikon" aria-hidden="true">▤</span><span class="tekst">Stor visning</span></button>
    <button class="knap lille ikon-knap" id="lyd-knap" aria-pressed="true"><span class="ikon" aria-hidden="true">🔊</span><span class="tekst">Lyd til</span></button>
    <button class="knap lille ikon-knap" id="fuldskaerm-knap"><span class="ikon" aria-hidden="true">⛶</span><span class="tekst">Fuldskærm</span></button>
    <a class="knap lille ikon-knap" href="/admin" title="Admin" aria-label="Admin"><span class="ikon" aria-hidden="true">⚙</span><span class="tekst">Admin</span></a>
  </div>
</header>

<div class="lyd-advarsel" id="lyd-advarsel" hidden>
  <button class="knap lille primaer" id="lyd-aktiver">Klik her for at slå lyd til</button>
  <span>Browseren kræver et klik, før den må afspille lyd.</span>
</div>

<div class="tavle-ramme">
<main class="tavle" id="tavle">
  <section class="kolonne" data-kolonne="ny" aria-labelledby="h-ny">
    <h2 id="h-ny" class="kolonne-titel ny">Nye <span class="antal" data-antal="ny">0</span></h2>
    <div class="kort-liste" data-liste="ny"></div>
  </section>
  <section class="kolonne" data-kolonne="laves" aria-labelledby="h-laves">
    <h2 id="h-laves" class="kolonne-titel laves">Laves <span class="antal" data-antal="laves">0</span></h2>
    <div class="kort-liste" data-liste="laves"></div>
  </section>
  <section class="kolonne" data-kolonne="klar-bord" aria-labelledby="h-klar-bord">
    <h2 id="h-klar-bord" class="kolonne-titel klar"><span>Klar <span class="titel-under bord">· Bring ud</span></span> <span class="antal" data-antal="klar-bord">0</span></h2>
    <div class="kort-liste" data-liste="klar-bord"></div>
  </section>
  <section class="kolonne" data-kolonne="klar-hent" aria-labelledby="h-klar-hent">
    <h2 id="h-klar-hent" class="kolonne-titel klar"><span>Klar <span class="titel-under hent">· Afhentning</span></span> <span class="antal" data-antal="klar-hent">0</span></h2>
    <div class="kort-liste" data-liste="klar-hent"></div>
  </section>
</main>
</div>

<details class="seneste" id="seneste">
  <summary>Seneste leverede <span class="antal" data-antal="seneste">0</span> <span class="hjaelp">(sidste 2 timer)</span></summary>
  <div class="seneste-liste" id="seneste-liste"></div>
</details>

<aside class="panel" id="indbetalinger-panel" hidden aria-label="Afventende indbetalinger">
  <div class="panel-hoved"><h2>Afventende indbetalinger</h2><button class="knap lille" data-luk>Luk</button></div>
  <div class="panel-indhold" id="indbetalinger-liste"></div>
</aside>

<aside class="panel" id="udsolgt-panel" hidden aria-label="Udsolgt">
  <div class="panel-hoved"><h2>Udsolgt / på lager</h2><button class="knap lille" data-luk>Luk</button></div>
  <p class="hjaelp panel-hjaelp">Tryk på en vare for at skifte. Udsolgte varer kan ikke bestilles.</p>
  <label class="panel-soeg"><span class="skjult-visuelt">Find vare</span><input type="search" id="udsolgt-soeg" placeholder="Find vare" autocomplete="off"></label>
  <div class="panel-indhold" id="udsolgt-liste"></div>
</aside>

<script type="module" src="/butik/butik.js"></script>
</body>
</html>
